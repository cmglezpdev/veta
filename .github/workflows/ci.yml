name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # POSIX-only matrix for v1. Windows path handling (%APPDATA%, reserved
    # stems, case-insensitive containment, .exe suffix) is implemented but
    # deliberately not CI-verified, because execFile on a shebang script does
    # not work there and the .cmd shim it would need cannot be exercised here.
    #
    # No `container:` on purpose: GitHub-hosted runners are non-root, and the
    # write-failure tests do not fail for uid 0.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          # youtube-dl-exec's postinstall downloads a yt-dlp binary from the
          # GitHub releases API, unauthenticated. Hosted runners share egress
          # IPs, so that call hits the 60/hour anonymous rate limit and the
          # install dies — it took out macOS on the first run of this workflow.
          #
          # CI never invokes yt-dlp: every test reads committed fixtures. So
          # the download is skipped rather than authenticated, which removes
          # the network dependency instead of making it more reliable.
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"

      # Node and Vitest strip types without checking them, so this is a
      # separate mandatory gate rather than a side effect of the test run.
      - run: pnpm typecheck

      - run: pnpm test

  # The commit-msg hook cannot see this one. Merging a PR produces a commit
  # whose subject is the PR *title*, written by GitHub on the server, where no
  # local hook runs — so a malformed title lands on main unchallenged. That
  # already happened once: `eat(transcript): ...` (PR #2) lost its leading `f`
  # and release-please silently dropped it from the changelog.
  #
  # The check runs the very same hook against the title rather than restating
  # its regex, so the rule has one definition and cannot drift between the two
  # places it is enforced.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Title must be a Conventional Commit
        env:
          # Passed through the environment, never interpolated into the script:
          # a PR title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          .githooks/commit-msg "$RUNNER_TEMP/pr-title"
